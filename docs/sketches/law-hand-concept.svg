<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 900" font-family="-apple-system, 'PingFang SC', 'Hiragino Sans GB', sans-serif">
  <!-- 背景 -->
  <rect width="1400" height="900" fill="#0d0e15"/>

  <!-- 标题 -->
  <text x="700" y="50" text-anchor="middle" fill="#e8e9ed" font-size="28" font-weight="bold">§3.5 法则牌桌 (Law Hand) — UI 概念示意图</text>
  <text x="700" y="80" text-anchor="middle" fill="#7a7d8a" font-size="14">Run 级结构界面（玩家在每场战斗之间看到的画面）</text>

  <!-- ======================================== -->
  <!-- 顶部 HUD - 全局状态条 -->
  <!-- ======================================== -->
  <g id="top-hud">
    <rect x="60" y="110" width="1280" height="70" fill="none" stroke="#2a3040" stroke-width="1.5" rx="4"/>
    <text x="80" y="135" fill="#7a7d8a" font-size="12">[1] 顶部 HUD（全局状态）</text>

    <!-- 圣所完整度 -->
    <g transform="translate(100,150)">
      <text x="0" y="0" fill="#e8e9ed" font-size="14">❤️ 圣所完整度</text>
      <g transform="translate(120,-12)">
        <rect width="20" height="16" fill="#3ec0c8" stroke="#3ec0c8" stroke-width="1"/>
        <rect x="22" width="20" height="16" fill="#3ec0c8" stroke="#3ec0c8" stroke-width="1"/>
        <rect x="44" width="20" height="16" fill="#3ec0c8" stroke="#3ec0c8" stroke-width="1"/>
        <rect x="66" width="20" height="16" fill="#3ec0c8" stroke="#3ec0c8" stroke-width="1"/>
        <rect x="88" width="20" height="16" fill="none" stroke="#2a3040" stroke-width="1"/>
        <rect x="110" width="20" height="16" fill="none" stroke="#2a3040" stroke-width="1"/>
        <rect x="132" width="20" height="16" fill="none" stroke="#2a3040" stroke-width="1"/>
      </g>
      <text x="280" y="0" fill="#7a7d8a" font-size="12">4 / 7</text>
    </g>

    <!-- 灵能 -->
    <g transform="translate(450,150)">
      <text x="0" y="0" fill="#e8e9ed" font-size="14">✨ 灵能 (Spirit)</text>
      <circle cx="115" cy="-5" r="8" fill="#3ec0c8" opacity="0.7"/>
      <circle cx="130" cy="-5" r="8" fill="#3ec0c8" opacity="0.7"/>
      <circle cx="145" cy="-5" r="8" fill="#3ec0c8" opacity="0.7"/>
      <text x="170" y="0" fill="#3ec0c8" font-size="20" font-weight="bold">12</text>
    </g>

    <!-- 牌堆进度 -->
    <g transform="translate(700,150)">
      <text x="0" y="0" fill="#e8e9ed" font-size="14">🎴 牌堆进度</text>
      <rect x="100" y="-12" width="160" height="14" fill="none" stroke="#2a3040"/>
      <rect x="100" y="-12" width="55" height="14" fill="#7a3ec8" opacity="0.6"/>
      <text x="270" y="0" fill="#7a7d8a" font-size="12">7 / 18 已执行</text>
    </g>

    <!-- 卡组与构件入口 -->
    <g transform="translate(1050,150)">
      <rect x="0" y="-18" width="100" height="24" fill="none" stroke="#3ec0c8" stroke-width="1" rx="2"/>
      <text x="50" y="-1" text-anchor="middle" fill="#3ec0c8" font-size="12">⚙ 卡组管理</text>
      <rect x="110" y="-18" width="100" height="24" fill="none" stroke="#3ec0c8" stroke-width="1" rx="2"/>
      <text x="160" y="-1" text-anchor="middle" fill="#3ec0c8" font-size="12">🛡 我的构件</text>
    </g>
  </g>

  <!-- ======================================== -->
  <!-- 中央牌桌 - 5 张行动卡 -->
  <!-- ======================================== -->
  <g id="hand-of-5">
    <text x="80" y="220" fill="#7a7d8a" font-size="12">[2] 中央牌桌 — 始终保持 5 张可选行动卡（悬浮在虚空中，可点选）</text>

    <!-- Card 1: 入侵者 -->
    <g transform="translate(120,260)">
      <polygon points="0,30 30,0 200,0 230,30 230,260 200,290 30,290 0,260" fill="#1a1f2e" stroke="#c83e3e" stroke-width="2"/>
      <text x="115" y="35" text-anchor="middle" fill="#c83e3e" font-size="40">⚔️</text>
      <text x="115" y="80" text-anchor="middle" fill="#e8e9ed" font-size="16" font-weight="bold">入侵者</text>
      <text x="115" y="100" text-anchor="middle" fill="#7a7d8a" font-size="11">Invader</text>
      <line x1="30" y1="115" x2="200" y2="115" stroke="#2a3040"/>
      <text x="115" y="140" text-anchor="middle" fill="#a8aab5" font-size="11">主题：重装潮</text>
      <text x="115" y="160" text-anchor="middle" fill="#a8aab5" font-size="11">敌人：3 重装 + 2 炮灰</text>
      <text x="115" y="180" text-anchor="middle" fill="#a8aab5" font-size="11">锚点：2 / 裂口：节奏快</text>
      <text x="115" y="220" text-anchor="middle" fill="#3ec0c8" font-size="11">击杀奖励：+8 灵能</text>
      <text x="115" y="270" text-anchor="middle" fill="#7a7d8a" font-size="10">[ 触发战斗 ]</text>
    </g>

    <!-- Card 2: 虚空商店 -->
    <g transform="translate(370,260)">
      <polygon points="0,30 30,0 200,0 230,30 230,260 200,290 30,290 0,260" fill="#1a1f2e" stroke="#3ec0c8" stroke-width="2"/>
      <text x="115" y="35" text-anchor="middle" fill="#3ec0c8" font-size="40">🏪</text>
      <text x="115" y="80" text-anchor="middle" fill="#e8e9ed" font-size="16" font-weight="bold">虚空商店</text>
      <text x="115" y="100" text-anchor="middle" fill="#7a7d8a" font-size="11">Void Shop</text>
      <line x1="30" y1="115" x2="200" y2="115" stroke="#2a3040"/>
      <text x="115" y="140" text-anchor="middle" fill="#a8aab5" font-size="11">商品（用灵能购买）：</text>
      <text x="115" y="160" text-anchor="middle" fill="#a8aab5" font-size="10">《临时折射场》— 5</text>
      <text x="115" y="178" text-anchor="middle" fill="#a8aab5" font-size="10">棱镜「转向冲撞」— 8</text>
      <text x="115" y="196" text-anchor="middle" fill="#a8aab5" font-size="10">遗物·虚空回响 — 12</text>
      <text x="115" y="270" text-anchor="middle" fill="#7a7d8a" font-size="10">[ 进入商店 ]</text>
    </g>

    <!-- Card 3: 法则井 -->
    <g transform="translate(620,260)">
      <polygon points="0,30 30,0 200,0 230,30 230,260 200,290 30,290 0,260" fill="#1a1f2e" stroke="#7a3ec8" stroke-width="2"/>
      <text x="115" y="35" text-anchor="middle" fill="#7a3ec8" font-size="40">🎴</text>
      <text x="115" y="80" text-anchor="middle" fill="#e8e9ed" font-size="16" font-weight="bold">法则井</text>
      <text x="115" y="100" text-anchor="middle" fill="#7a7d8a" font-size="11">Law Well</text>
      <line x1="30" y1="115" x2="200" y2="115" stroke="#2a3040"/>
      <text x="115" y="145" text-anchor="middle" fill="#a8aab5" font-size="11">免费抽 1 张法则卡</text>
      <text x="115" y="165" text-anchor="middle" fill="#a8aab5" font-size="11">入卡组（3 选 1）</text>
      <text x="115" y="200" text-anchor="middle" fill="#3ec0c8" font-size="11">不消耗灵能</text>
      <text x="115" y="270" text-anchor="middle" fill="#7a7d8a" font-size="10">[ 抽法则卡 ]</text>
    </g>

    <!-- Card 4: 秩序修复 -->
    <g transform="translate(870,260)">
      <polygon points="0,30 30,0 200,0 230,30 230,260 200,290 30,290 0,260" fill="#1a1f2e" stroke="#3ec88a" stroke-width="2"/>
      <text x="115" y="35" text-anchor="middle" fill="#3ec88a" font-size="40">❤️</text>
      <text x="115" y="80" text-anchor="middle" fill="#e8e9ed" font-size="16" font-weight="bold">秩序修复</text>
      <text x="115" y="100" text-anchor="middle" fill="#7a7d8a" font-size="11">Order Mend</text>
      <line x1="30" y1="115" x2="200" y2="115" stroke="#2a3040"/>
      <text x="115" y="145" text-anchor="middle" fill="#a8aab5" font-size="11">恢复 +2 圣所完整度</text>
      <text x="115" y="180" text-anchor="middle" fill="#3ec0c8" font-size="11">不消耗灵能</text>
      <text x="115" y="270" text-anchor="middle" fill="#7a7d8a" font-size="10">[ 修复 ]</text>
    </g>

    <!-- Card 5: 法则裂痕 -->
    <g transform="translate(1120,260)">
      <polygon points="0,30 30,0 200,0 230,30 230,260 200,290 30,290 0,260" fill="#1a1f2e" stroke="#c8a83e" stroke-width="2" stroke-dasharray="4,3"/>
      <text x="115" y="35" text-anchor="middle" fill="#c8a83e" font-size="40">🌀</text>
      <text x="115" y="80" text-anchor="middle" fill="#e8e9ed" font-size="16" font-weight="bold">法则裂痕</text>
      <text x="115" y="100" text-anchor="middle" fill="#7a7d8a" font-size="11">Law Rift</text>
      <line x1="30" y1="115" x2="200" y2="115" stroke="#2a3040"/>
      <text x="115" y="145" text-anchor="middle" fill="#a8aab5" font-size="11">随机事件：</text>
      <text x="115" y="165" text-anchor="middle" fill="#a8aab5" font-size="10">赌博 / 牺牲 / 净化</text>
      <text x="115" y="200" text-anchor="middle" fill="#c8a83e" font-size="11">高风险高回报</text>
      <text x="115" y="270" text-anchor="middle" fill="#7a7d8a" font-size="10">[ 进入裂痕 ]</text>
    </g>
  </g>

  <!-- 卡片下方说明 -->
  <text x="700" y="600" text-anchor="middle" fill="#7a7d8a" font-size="11">↑ 玩家点击其中 1 张 → 执行其内容 → 该卡消失，从牌堆补 1 张到桌面</text>
  <text x="700" y="618" text-anchor="middle" fill="#7a7d8a" font-size="11">↑ 桌面始终保持 5 张可选；不喜欢的牌可消耗 1 灵能舍弃后立即从牌堆补 1 张</text>

  <!-- ======================================== -->
  <!-- 底部区 - 牌堆 / 弃牌堆 / 终极仪式 -->
  <!-- ======================================== -->
  <g id="bottom-area">
    <rect x="60" y="650" width="1280" height="220" fill="none" stroke="#2a3040" stroke-width="1.5" rx="4"/>
    <text x="80" y="675" fill="#7a7d8a" font-size="12">[3] 底部区 — 牌堆 / Boss 锁底 / 操作提示</text>

    <!-- 牌堆 -->
    <g transform="translate(120,710)">
      <rect x="-2" y="-2" width="100" height="130" fill="#1a1f2e" stroke="#3ec0c8" stroke-width="1"/>
      <rect x="-4" y="-4" width="100" height="130" fill="none" stroke="#3ec0c8" stroke-width="1" opacity="0.5"/>
      <rect x="-6" y="-6" width="100" height="130" fill="none" stroke="#3ec0c8" stroke-width="1" opacity="0.3"/>
      <text x="48" y="55" text-anchor="middle" fill="#3ec0c8" font-size="36" font-weight="bold">11</text>
      <text x="48" y="80" text-anchor="middle" fill="#7a7d8a" font-size="11">剩余卡数</text>
      <text x="48" y="145" text-anchor="middle" fill="#a8aab5" font-size="11">📥 牌堆</text>
    </g>

    <!-- 已执行（弃牌堆） -->
    <g transform="translate(280,710)">
      <rect x="-2" y="-2" width="100" height="130" fill="#0a0c14" stroke="#2a3040" stroke-width="1"/>
      <text x="48" y="55" text-anchor="middle" fill="#7a7d8a" font-size="36">7</text>
      <text x="48" y="80" text-anchor="middle" fill="#7a7d8a" font-size="11">已执行</text>
      <text x="48" y="145" text-anchor="middle" fill="#7a7d8a" font-size="11">📤 历史</text>
    </g>

    <!-- 中央：当前轮选择提示 -->
    <g transform="translate(460,705)">
      <rect width="500" height="140" fill="none" stroke="#2a3040" stroke-width="1" stroke-dasharray="3,3" rx="2"/>
      <text x="250" y="30" text-anchor="middle" fill="#e8e9ed" font-size="14">当前操作提示</text>
      <text x="250" y="60" text-anchor="middle" fill="#a8aab5" font-size="12">选择上方任一行动卡执行</text>
      <text x="250" y="85" text-anchor="middle" fill="#a8aab5" font-size="12">或：消耗 1 灵能舍弃 1 张牌（按 [D] 键）</text>
      <text x="250" y="115" text-anchor="middle" fill="#7a7d8a" font-size="11">悬停某张卡片可查看详细预览</text>
    </g>

    <!-- 终极仪式 Boss 锁底 -->
    <g transform="translate(1140,710)">
      <polygon points="0,15 15,0 130,0 145,15 145,115 130,130 15,130 0,115" fill="#2a0a14" stroke="#c83e3e" stroke-width="2"/>
      <text x="72" y="40" text-anchor="middle" fill="#c83e3e" font-size="32">👑</text>
      <text x="72" y="70" text-anchor="middle" fill="#c83e3e" font-size="13" font-weight="bold">终极仪式</text>
      <text x="72" y="88" text-anchor="middle" fill="#a8aab5" font-size="10">Final Ritual</text>
      <text x="72" y="110" text-anchor="middle" fill="#7a7d8a" font-size="10">牌堆耗尽时</text>
      <text x="72" y="124" text-anchor="middle" fill="#7a7d8a" font-size="10">强制触发</text>
    </g>
  </g>

  <!-- ======================================== -->
  <!-- 右下角图例 -->
  <!-- ======================================== -->
  <g id="legend" transform="translate(60,895)">
    <text x="0" y="-7" fill="#7a7d8a" font-size="11">配比：8 入侵者 ⚔️  +  2 精英入侵 ⚠️  +  2 商店 🏪  +  2 修复 ❤️  +  2 法则井 🎴  +  2 裂痕 🌀  =  18 张行动卡 + 1 张终极仪式 = 19 张牌堆</text>
  </g>
</svg>
